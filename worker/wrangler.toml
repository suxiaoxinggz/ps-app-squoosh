name = "squoosh-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.traces]
enabled = true

[assets]
directory = "../build"
binding = "ASSETS"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "squoosh-tmp"

[[kv_namespaces]]
binding = "JOBS"
id = "fcf56093bb494457a51a7dce95b4ff92"

[[queues.producers]]
binding = "QUEUE"
queue = "squoosh-jobs"

[[queues.consumers]]
queue = "squoosh-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 2
dead_letter_queue = "squoosh-dlq"

# Staging environment (verify here before touching prod)
[env.staging]
name = "squoosh-mcp-staging"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "squoosh-tmp-staging"

[[env.staging.kv_namespaces]]
binding = "JOBS"
id = "3d9fcd6e92f140b59a20f0f54d824299"

[[env.staging.queues.producers]]
binding = "QUEUE"
queue = "squoosh-jobs-staging"

[[env.staging.queues.consumers]]
queue = "squoosh-jobs-staging"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 2
