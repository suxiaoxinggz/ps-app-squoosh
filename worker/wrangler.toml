name = "squoosh-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.traces]
enabled = true

[assets]
directory = "../build"
binding = "ASSETS"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "squoosh-tmp"

[[kv_namespaces]]
binding = "JOBS"
id = "fcf56093bb494457a51a7dce95b4ff92"

[[queues.producers]]
binding = "QUEUE"
queue = "squoosh-jobs"

[[queues.consumers]]
queue = "squoosh-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 2
dead_letter_queue = "squoosh-dlq"

# Upscale: one tile per message, one message at a time. Serialised because the
# stitcher updates a single KV job record per tile and Render keeps one ONNX
# session (512MB free instance).
[[queues.producers]]
binding = "UPSCALE_QUEUE"
queue = "squoosh-upscale"

[[queues.consumers]]
queue = "squoosh-upscale"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
# 512MB Render restarts take ~30-60s and 502 every tile in that window; retry
# with a delay instead of burning all attempts back to back.
max_retries = 5
retry_delay = 15
dead_letter_queue = "squoosh-upscale-dlq"

# Staging environment (verify here before touching prod)
[env.staging]
name = "squoosh-mcp-staging"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "squoosh-tmp-staging"

[[env.staging.kv_namespaces]]
binding = "JOBS"
id = "3d9fcd6e92f140b59a20f0f54d824299"

[[env.staging.queues.producers]]
binding = "QUEUE"
queue = "squoosh-jobs-staging"

[[env.staging.queues.consumers]]
queue = "squoosh-jobs-staging"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 2

[[env.staging.queues.producers]]
binding = "UPSCALE_QUEUE"
queue = "squoosh-upscale-staging"

[[env.staging.queues.consumers]]
queue = "squoosh-upscale-staging"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
max_retries = 5
retry_delay = 15
dead_letter_queue = "squoosh-upscale-dlq-staging"
